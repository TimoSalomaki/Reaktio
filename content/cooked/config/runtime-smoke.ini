[app]
startup_mode_id = mode.reference.sandbox
random_seed = 0x5245414b54494f32
app_identifier = fi.reaktio.engine
log_file_name = reaktio-runtime.log

[window]
title = Reaktio Platform Smoke
width = 1280
height = 720
mode = windowed
resizable = true
high_pixel_density = true
start_hidden = true
enable_text_input = true

[main_loop]
fixed_step_seconds = 0.008333333333333333
max_frame_delta_seconds = 0.25
max_fixed_steps_per_frame = 8
max_frame_count = 16

[audio]
enable_playback_device = true
fail_if_unavailable = false
preferred_sample_rate = 48000
preferred_channels = 2
preferred_buffer_frames = 1024
preferred_format = f32
start_paused = true
device_gain = 1.0

[renderer]
backend = noop
vsync_enabled = false

[debug]
enable_startup_diagnostics = true
enable_debug_overlay = false
enable_input_diagnostics = false
enable_gpu_debug = false

[input]
active_device_profile = keyboard_mouse
active_contexts = system, gameplay

[input_device_profile.keyboard_mouse]
display_name = Keyboard and Mouse

[input_device_profile.gamepad]
display_name = Gamepad

[input_context.system]
active = true

[input_context.gameplay]
active = true

[hot_reload]
enabled = true
poll_interval_seconds = 0.25
watch_charts = true
watch_shaders = true
watch_materials = true
watch_selected_content = true

[post_process]
enabled = true
bloom_threshold = 0.72
bloom_intensity = 0.35
bloom_blur_scale = 1.0
exposure = 1.0
saturation = 1.04
contrast = 1.05
vignette_intensity = 0.18
feedback_mix = 0.08
feedback_decay = 0.96
feedback_scale = 1.004
color_grade_r = 1.03
color_grade_g = 1.00
color_grade_b = 0.97

[budget]
target_frame_ms = 16.67
simulation_budget_ms = 2.0
render_submission_budget_ms = 3.0
audio_callback_budget_ms = 1.0
resident_memory_budget_mib = 512
draw_call_budget = 1500
visible_cue_budget = 10000

[input_binding.system.toggle_fullscreen]
primary = keyboard:F11

[input_binding.system.request_quit]
primary = keyboard:Escape

[input_binding.gameplay.transport_pause]
primary = keyboard:Space

[input_binding.gameplay.transport_restart]
primary = keyboard:R

[input_binding.gameplay.calibration_output_mode]
primary = keyboard:O

[input_binding.gameplay.calibration_input_mode]
primary = keyboard:I

[input_binding.gameplay.calibration_commit]
primary = keyboard:Return

[input_binding.gameplay.calibration_clear]
primary = keyboard:Backspace

[input_binding.gameplay.calibration_adjust_negative]
primary = keyboard:Left

[input_binding.gameplay.calibration_adjust_positive]
primary = keyboard:Right

[input_binding.gameplay.practice_speed_decrease]
primary = keyboard:Z

[input_binding.gameplay.practice_speed_increase]
primary = keyboard:X

[input_binding.gameplay.practice_speed_reset]
primary = keyboard:C

[input_binding.gameplay.practice_loop_mark_start]
primary = keyboard:J

[input_binding.gameplay.practice_loop_mark_end]
primary = keyboard:K

[input_binding.gameplay.practice_loop_apply]
primary = keyboard:L

[input_binding.gameplay.practice_loop_clear]
primary = keyboard:U

[input_binding.gameplay.practice_offset_visualization_toggle]
primary = keyboard:V

[mode.mode.reference.sandbox]
velocity_scale = 1.0
hit_window_half_width = 32.0
hit_window_half_height = 24.0
practice_scroll_speed_multiplier = 1.25
practice_offset_visualization_enabled = true
practice_loop_start_seconds = 0.75
practice_loop_end_seconds = 1.25
cue_material_authoring_id = reference.sandbox.material.cue
debug_font_authoring_id = reference.sandbox.font.debug

[modifier.mode.reference.sandbox]
speed_multiplier = 1.0
autoplay = false
no_fail = false
mirror_channels = 0
practice_assist = true