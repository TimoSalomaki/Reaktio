[app]
startup_mode_id = mode.reference.sandbox
random_seed = 0x5245414b54494f32
app_identifier = fi.reaktio.engine
log_file_name = reaktio-runtime.log

[window]
title = Reaktio Platform Smoke
width = 1280
height = 720
mode = windowed
resizable = true
high_pixel_density = true
start_hidden = true
enable_text_input = true

[main_loop]
fixed_step_seconds = 0.008333333333333333
max_frame_delta_seconds = 0.25
max_fixed_steps_per_frame = 8
max_frame_count = 16

[audio]
enable_playback_device = true
fail_if_unavailable = false
preferred_sample_rate = 48000
preferred_channels = 2
preferred_buffer_frames = 1024
preferred_format = f32
start_paused = true
device_gain = 1.0

[renderer]
backend = noop
vsync_enabled = false

[debug]
enable_startup_diagnostics = true
enable_debug_overlay = false
enable_input_diagnostics = false
enable_gpu_debug = false

[budget]
target_frame_ms = 16.67
simulation_budget_ms = 2.0
render_submission_budget_ms = 3.0
audio_callback_budget_ms = 1.0
resident_memory_budget_mib = 512
draw_call_budget = 1500
visible_cue_budget = 10000

[input_binding.toggle_fullscreen]
primary = keyboard:F11

[input_binding.request_quit]
primary = keyboard:Escape

[input_binding.transport_pause]
primary = keyboard:Space

[input_binding.transport_restart]
primary = keyboard:R

[input_binding.calibration_output_mode]
primary = keyboard:O

[input_binding.calibration_input_mode]
primary = keyboard:I

[input_binding.calibration_commit]
primary = keyboard:Return

[input_binding.calibration_clear]
primary = keyboard:Backspace

[input_binding.calibration_adjust_negative]
primary = keyboard:Left

[input_binding.calibration_adjust_positive]
primary = keyboard:Right

[input_binding.practice_speed_decrease]
primary = keyboard:Z

[input_binding.practice_speed_increase]
primary = keyboard:X

[input_binding.practice_speed_reset]
primary = keyboard:C

[input_binding.practice_loop_mark_start]
primary = keyboard:J

[input_binding.practice_loop_mark_end]
primary = keyboard:K

[input_binding.practice_loop_apply]
primary = keyboard:L

[input_binding.practice_loop_clear]
primary = keyboard:U

[input_binding.practice_offset_visualization_toggle]
primary = keyboard:V

[mode.mode.reference.sandbox]
velocity_scale = 1.0
hit_window_half_width = 32.0
hit_window_half_height = 24.0
practice_scroll_speed_multiplier = 1.25
practice_offset_visualization_enabled = true
practice_loop_start_seconds = 0.75
practice_loop_end_seconds = 1.25
cue_material_authoring_id = reference.sandbox.material.cue
debug_font_authoring_id = reference.sandbox.font.debug