name: windows-bootstrap

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake --preset ci-debug

      - name: Build smoke target
        run: cmake --build --preset build-ci-debug --target reaktio_smoke

      - name: Build bgfx tools bootstrap target
        if: github.event_name != 'pull_request'
        run: cmake --build --preset build-ci-debug --target reaktio-bootstrap-tools